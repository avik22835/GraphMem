<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — GraphMem</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">

    <a href="/" class="auth-logo">
      <span class="logo-icon">⬡</span>
      GraphMem
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to your GraphMem account.</p>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          type="email" id="email" name="email"
          class="form-input" placeholder="you@example.com"
          autocomplete="email" required
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          type="password" id="password" name="password"
          class="form-input" placeholder="••••••••"
          autocomplete="current-password" required
        />
      </div>

      <div id="errorMsg" class="form-error hidden" style="margin-bottom:14px;"></div>

      <button type="submit" class="btn btn-primary w-full" id="submitBtn">
        Log in
      </button>
    </form>

    <p class="auth-footer mt-24">
      Don't have an account? <a href="/signup">Sign up free →</a>
    </p>

  </div>
</div>

<script src="/static/js/auth.js"></script>
<script>
  if (gmIsAuthenticated()) window.location.href = '/dashboard';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submitBtn');
    const err      = document.getElementById('errorMsg');

    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled  = true;
    err.classList.add('hidden');

    try {
      await gmSignIn(email, password);
      const next = new URLSearchParams(window.location.search).get('next') || '/dashboard';
      window.location.href = next;
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.remove('hidden');
      btn.textContent = 'Log in';
      btn.disabled    = false;
    }
  });
</script>
</body>
</html>
