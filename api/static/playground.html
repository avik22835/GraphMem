<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Playground — GraphMem</title>
  <link rel="stylesheet" href="/static/css/styles.css"/>
  <style>
    body { overflow: hidden; margin: 0; }
    .pg-wrap { display: flex; height: 100vh; padding-top: 64px; box-sizing: border-box; }

    /* ── Sidebar ───────────────────────────────────────────────── */
    .pg-sidebar {
      width: 248px; min-width: 248px; background: #0d1117;
      border-right: 1px solid #1e2a38;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pg-sidebar-top { padding: 14px; border-bottom: 1px solid #1e2a38; }
    .pg-field-label {
      font-size: 10px; font-weight: 700; color: #6e7681;
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px;
    }
    .pg-api-key, .pg-conv-select {
      width: 100%; box-sizing: border-box; background: #161b22;
      border: 1px solid #30363d; border-radius: 6px; color: #e6edf3;
      font-size: 12px; padding: 7px 10px; font-family: 'SF Mono', monospace;
    }
    .pg-api-key { margin-bottom: 10px; }
    .pg-conv-select { cursor: pointer; }
    .pg-method-list { flex: 1; overflow-y: auto; padding: 6px 0 24px; }
    .pg-ns-head {
      font-size: 10px; font-weight: 700; color: #484f58;
      text-transform: uppercase; letter-spacing: .9px; padding: 14px 14px 4px;
    }
    .pg-item {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px 6px 22px; font-size: 13px; color: #8b949e;
      cursor: pointer; border-left: 2px solid transparent;
      transition: all .12s; font-family: 'SF Mono', monospace;
      user-select: none;
    }
    .pg-item:hover { color: #e6edf3; background: #161b22; }
    .pg-item.active { color: #00d97e; border-left-color: #00d97e; background: #0d1f18; }
    .jwt-tag {
      font-size: 9px; background: #2d1b00; color: #d29922;
      border-radius: 3px; padding: 1px 4px; font-family: sans-serif;
    }

    /* ── Main ──────────────────────────────────────────────────── */
    .pg-main { flex: 1; overflow-y: auto; padding: 36px 44px 64px; background: #fff; }
    .method-title {
      font-size: 21px; font-weight: 700; color: #0f1923; margin: 0 0 3px;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .method-http { font-size: 12px; color: #8b949e; margin: 0 0 18px; font-family: monospace; }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px; margin-left: 8px;
      vertical-align: middle; position: relative; top: -2px;
    }
    .b-POST   { background: #0d261c; color: #00d97e; }
    .b-GET    { background: #0a1628; color: #388bfd; }
    .b-DELETE { background: #2d0f0f; color: #f85149; }
    .method-desc { font-size: 14px; color: #374151; line-height: 1.65; margin-bottom: 16px; }
    .usecase-box {
      background: #f0fdf9; border: 1px solid #a7f3d0;
      border-left: 3px solid #00d97e; border-radius: 8px;
      padding: 13px 16px; margin-bottom: 26px;
    }
    .uc-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .8px; color: #059669; margin-bottom: 5px;
    }
    .uc-text { font-size: 13px; color: #064e3b; margin: 0; line-height: 1.55; }
    .sec-label {
      font-size: 11px; font-weight: 700; color: #6e7681;
      text-transform: uppercase; letter-spacing: .8px; margin: 0 0 8px;
    }
    pre.code-block {
      background: #0d1117; border: 1px solid #30363d; border-radius: 10px;
      padding: 18px 20px; font-family: 'SF Mono', Consolas, monospace;
      font-size: 12.5px; line-height: 1.75; color: #e6edf3;
      overflow-x: auto; margin: 0 0 20px; white-space: pre;
    }
    .ck { color: #ff7b72; } .cs { color: #a5d6ff; }
    .cc { color: #6e7681; } .cn { color: #f2cc60; }
    .params-wrap { margin-bottom: 20px; }
    .param-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .param-label { font-size: 12px; font-weight: 600; color: #374151; min-width: 100px; }
    .param-input {
      flex: 1; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 7px 11px; font-size: 13px; font-family: 'SF Mono', monospace;
      color: #0f1923; background: #f9fafb; transition: border-color .15s;
    }
    .param-input:focus { outline: none; border-color: #00d97e; background: #fff; }
    .param-input[type=number] { max-width: 90px; }
    .param-id {
      flex: 1; font-size: 11px; font-family: 'SF Mono', monospace; color: #6e7681;
      background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px;
      padding: 7px 11px; word-break: break-all;
    }
    .run-btn {
      display: inline-flex; align-items: center; gap: 8px; background: #00d97e;
      color: #0d1117; border: none; border-radius: 8px; padding: 10px 26px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; margin-bottom: 26px;
    }
    .run-btn:hover { background: #00b868; transform: translateY(-1px); }
    .run-btn:active { transform: none; }
    .run-btn:disabled { background: #6b7280; cursor: not-allowed; transform: none; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid #0d1117;
      border-top-color: transparent; border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .jwt-notice {
      background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px;
      padding: 12px 16px; font-size: 13px; color: #92400e; margin-bottom: 18px;
    }
    .output-panel {
      background: #0d1117; border: 1px solid #30363d; border-radius: 10px;
      padding: 16px 20px; font-family: 'SF Mono', Consolas, monospace;
      font-size: 12.5px; line-height: 1.6; color: #e6edf3;
      max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .output-panel.idle { color: #6e7681; font-style: italic; white-space: normal; }
    .output-panel.err  { border-color: #f85149; color: #ff7b72; }
    .context-label {
      font-size: 11px; font-weight: 700; color: #6e7681;
      text-transform: uppercase; letter-spacing: .8px; margin: 18px 0 6px;
    }
    .context-box {
      background: #1c2128; border: 1px solid #30363d; border-radius: 8px;
      padding: 14px 16px; font-size: 12px; line-height: 1.6; color: #c9d1d9;
      max-height: 180px; overflow-y: auto; white-space: pre-wrap; font-family: 'SF Mono', monospace;
    }
    .token-savings {
      margin-top: 18px; padding: 18px 20px; background: #f0fdf9;
      border: 1px solid #a7f3d0; border-radius: 10px;
    }
    .ts-title { font-size: 13px; font-weight: 700; color: #065f46; margin: 0 0 14px; }
    .ts-row { margin-bottom: 10px; }
    .ts-row-label { display: flex; justify-content: space-between; font-size: 11px; color: #374151; margin-bottom: 4px; }
    .ts-track { height: 22px; background: #d1fae5; border-radius: 5px; overflow: hidden; }
    .ts-fill {
      height: 100%; background: #00d97e; border-radius: 5px;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 8px; font-size: 10px; font-weight: 700; color: #0d1117;
      transition: width .7s ease;
    }
    .ts-savings { font-size: 13px; font-weight: 700; color: #065f46; margin-top: 10px; }
  </style>
</head>

    <a href="/playground" class="nav-link active">Playground</a>
    <a href="https://github.com/avik22835/graphmem" class="nav-link" target="_blank" rel="noopener">GitHub ↗</a>
    <div class="nav-right">
      <div class="nav-divider"></div>

<div class="pg-wrap">
  <aside class="pg-sidebar">
    <div class="pg-sidebar-top">
      <div class="pg-field-label">API Key</div>
      <input class="pg-api-key" id="apiKeyInput" type="text" placeholder="gm_sk_…"/>
      <div class="pg-field-label" style="margin-top:10px">Demo Conversation</div>
      <select class="pg-conv-select" id="convSelect" onchange="switchConv(this.value)">
        <option value="conv2">SaaS App Build (auth → payments → backend)</option>
        <option value="conv1">Multi-topic Chat (cooking → travel → coding)</option>
      </select>
    </div>
    <div class="pg-method-list" id="methodList"></div>
  </aside>

  <main class="pg-main" id="methodPanel">
    <div style="color:#6e7681;padding-top:40px;font-size:14px">Loading demo data…</div>
  </main>
</div>

<script>
/* ── Config ──────────────────────────────────────────────────────── */
const CONF = {
  conv1: { id: '0eaf5486-63c6-4f5c-a4d8-5c761f1fa91d', label: 'Multi-topic Chat' },
  conv2: { id: '0fd00ae3-5ffe-48f9-a3dc-6ac2e6badb16', label: 'SaaS App Build'   },
  demoKey: 'gm_sk_nAnHUcDRqsyb6D0ggwJeLJEUZhjuC91hK2mu4Q327MU'
};

const state = {
  conv: 'conv2', method: 'memory.recall',
  cache: {
    conv1: { nodes:[], topics:[], nodeId:null, topicId:null },
    conv2: { nodes:[], topics:[], nodeId:null, topicId:null }
  }
};

/* ── Helpers ─────────────────────────────────────────────────────── */
const apiKey  = () => document.getElementById('apiKeyInput').value.trim() || CONF.demoKey;
const convId  = () => CONF[state.conv].id;
const cache   = () => state.cache[state.conv];

async function apiFetch(path, opts={}) {
  const h = { 'X-API-Key': apiKey(), 'Content-Type': 'application/json', ...(opts.headers||{}) };
  const r = await fetch(path, { ...opts, headers: h });
  if (!r.ok) { const t = await r.text(); throw new Error(`${r.status} — ${t}`); }
  return r;
}

function hl(code) {
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/"([^"\n]*)"/g,  '<span class="cs">"$1"</span>');
  s = s.replace(/'([^'\n]*)'/g,  "<span class=\"cs\">'$1'</span>");
  s = s.replace(/(#[^\n]*)/g,    '<span class="cc">$1</span>');
  s = s.replace(/\b(import|from|await|async|def|return|for|in|if|else|True|False|None|print|len|not)\b/g,
                '<span class="ck">$1</span>');
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="cn">$1</span>');
  return s;
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Method definitions ──────────────────────────────────────────── */
const METHODS = [
  /* ── MEMORY ──────────────────────────────────────────── */
  {
    id:'memory.recall', ns:'memory', label:'recall', badge:'POST', http:'POST /memory/recall',
    desc:'Retrieves the k most semantically relevant memory nodes for a query using two-layer retrieval: pgvector HNSW cosine search (Layer 1) re-ranked by Neptune graph neighbourhood edges (Layer 2).',
    usecase:'Message 51 arrives in your chatbot. Instead of sending all 50 prior exchanges — often thousands of tokens — to your LLM, call recall() to fetch only the most relevant nodes. Focused context, fraction of the cost.',
    params:[
      {id:'query',label:'Query',type:'text',
       defConv1:'What cooking techniques did we discuss?',
       defConv2:'How should I handle JWT token expiry?'},
      {id:'k',label:'k',type:'number',def:5}
    ],
    code:(cid,p)=>
`import graphmem

gm = graphmem.GraphMemClient(api_key="gm_sk_...")

result = gm.memory.recall(
    conv_id="${cid}",
    query="${p.query}",
    k=${p.k},
    strategy="semantic",
)

# Feed to your LLM instead of full history
llm_context = result.context
print(f"GraphMem: {result.token_count} tokens")`,
    execute: async (cid,p) => {
      const sR = await apiFetch(`/conversations/${cid}/stats`);
      const stats = await sR.json();
      const r = await apiFetch('/memory/recall',{
        method:'POST',
        body:JSON.stringify({conversation_id:cid,query:p.query,k:parseInt(p.k),strategy:'semantic'})
      });
      const d = await r.json();
      d._fullEst = (stats.node_count||50)*150;
      return d;
    },
    extra:'token_savings'
  },
  {
    id:'memory.add_prompt', ns:'memory', label:'add_prompt', badge:'POST', http:'POST /memory/prompt',
    desc:'Logs a user prompt as a new pending memory node. Returns a memory_id — store it and pass to add_response() after your LLM replies to complete the node.',
    usecase:'Your agent receives a user message. Before forwarding it to your LLM, log it with add_prompt() so every turn is captured in the memory graph. Nothing is ever lost.',
    params:[
      {id:'content',label:'Content',type:'text',
       defConv1:'How do I make crème brûlée at home?',
       defConv2:'How do I rotate refresh tokens safely?'}
    ],
    code:(cid,p)=>
`memory_id = gm.memory.add_prompt(
    conv_id="${cid}",
    content="${p.content}",
)
# Save memory_id — pass it to add_response()
print(f"Node created: {memory_id}")`,
    execute: async (cid,p) => {
      const r = await apiFetch('/memory/prompt',{
        method:'POST', body:JSON.stringify({conversation_id:cid,content:p.content})
      });
      return r.json();
    }
  },
  {
    id:'memory.add_response', ns:'memory', label:'add_response', badge:'POST', http:'POST /memory/{memory_id}/response',
    desc:'Attaches your LLM\'s response to a pending node, marking it complete. Triggers the async pipeline: embedding computation → Neptune edge creation → topic recompute queue.',
    usecase:'Your LLM has replied. Call add_response() to seal the node. The node worker queues embedding computation immediately — this turn becomes searchable via recall() within seconds.',
    params:[
      {id:'content',label:'Response',type:'text',
       defConv1:'Crème brûlée requires a kitchen torch for the caramelized sugar top. Use heavy cream, not milk.',
       defConv2:'On each use of the refresh token, issue a brand new one and invalidate the old one (rotation pattern).'}
    ],
    code:(cid,p)=>
`# memory_id came from add_prompt()
gm.memory.add_response(
    memory_id=memory_id,
    conv_id="${cid}",
    content=llm_response,
)
# Node is now complete — embedding + graph edges queued`,
    execute: async (cid,p) => {
      const pR = await apiFetch('/memory/prompt',{
        method:'POST', body:JSON.stringify({conversation_id:cid,content:'Demo prompt for add_response example'})
      });
      const {memory_id} = await pR.json();
      const r = await apiFetch(`/memory/${memory_id}/response`,{
        method:'POST', body:JSON.stringify({conversation_id:cid,content:p.content})
      });
      return {memory_id, ...(await r.json())};
    }
  },
  {
    id:'memory.get', ns:'memory', label:'get', badge:'GET', http:'GET /memory/{memory_id}',
    desc:'Fetches a single memory node by ID — prompt, response, status, timestamps, and metadata.',
    usecase:'You stored a memory_id alongside a session. Retrieve it later to inspect what was logged, verify embedding status (status: complete means it\'s in the graph), or display the original exchange to the user.',
    params:[{id:'memory_id',label:'memory_id',type:'cache_node'}],
    code:(cid,p,c)=>
`node = gm.memory.get(memory_id="${c.nodeId||'<memory_id>'}")

print(node["prompt"])
print(node["response"])
print(node["status"])   # "complete" once embedded and in graph`,
    execute: async (cid,p,c) => {
      if (!c.nodeId) throw new Error('No nodes cached. Wait for embedding to complete and refresh.');
      const r = await apiFetch(`/memory/${c.nodeId}`);
      return r.json();
    }
  },
  {
    id:'memory.get_neighbours', ns:'memory', label:'get_neighbours', badge:'GET', http:'GET /memory/{memory_id}/neighbours',
    desc:'Returns memory nodes semantically adjacent to a given node in the Neptune cosine similarity graph, ranked by edge weight.',
    usecase:'"Show me more context around this message." get_neighbours() follows Neptune graph edges — surfaces all semantically related exchanges regardless of when they occurred in the conversation.',
    params:[
      {id:'memory_id',label:'memory_id',type:'cache_node'},
      {id:'threshold',label:'Threshold',type:'number',def:0.7}
    ],
    code:(cid,p,c)=>
`neighbours = gm.memory.get_neighbours(
    memory_id="${c.nodeId||'<memory_id>'}",
    threshold=${p.threshold},
    limit=10,
    order="relevance",
)
for n in neighbours:
    print(f"[{n['edge_weight']:.2f}] {n['prompt'][:80]}")`,
    execute: async (cid,p,c) => {
      if (!c.nodeId) throw new Error('No nodes cached. Wait for embedding to complete and refresh.');
      const r = await apiFetch(`/memory/${c.nodeId}/neighbours?threshold=${p.threshold}&limit=10&order=relevance`);
      return r.json();
    }
  },
  {
    id:'memory.add_batch', ns:'memory', label:'add_batch', badge:'POST', http:'POST /memory/batch',
    desc:'Bulk-inserts up to 100 complete prompt+response pairs in one request. All items are marked complete immediately and queued for embedding.',
    usecase:'Onboarding a user who already has chat history in your existing system. Instead of 200 individual API calls, batch-import their entire history and let GraphMem build the semantic graph asynchronously.',
    params:[],
    code:(cid)=>
`memory_ids = gm.memory.add_batch(items=[
    {
        "conversation_id": "${cid}",
        "prompt": "What's the difference between stateless and stateful auth?",
        "response": "Stateless auth (JWT) stores session in the token — no server-side state.",
    },
    {
        "conversation_id": "${cid}",
        "prompt": "Which is better for microservices?",
        "response": "Stateless JWT scales horizontally without a shared session store.",
    },
    {
        "conversation_id": "${cid}",
        "prompt": "What are the key security trade-offs?",
        "response": "JWT can't be revoked before expiry without a token denylist.",
    },
])
print(f"Imported {len(memory_ids)} nodes")`,
    execute: async (cid) => {
      const r = await apiFetch('/memory/batch',{
        method:'POST',
        body:JSON.stringify({items:[
          {conversation_id:cid,prompt:"What's the difference between stateless and stateful auth?",response:"Stateless auth (JWT) stores session in the token — no server-side state needed."},
          {conversation_id:cid,prompt:"Which is better for microservices?",response:"Stateless JWT scales horizontally without a shared session store."},
          {conversation_id:cid,prompt:"What are the key security trade-offs?",response:"JWT can't be revoked before expiry without a token denylist or short TTLs."}
        ]})
      });
      return r.json();
    }
  },

  /* ── CONVERSATIONS ────────────────────────────────────── */
  {
    id:'conversations.create', ns:'conversations', label:'create', badge:'POST', http:'POST /conversations',
    desc:'Creates a new empty conversation context and returns a conversation_id. Store this ID tied to your user or session.',
    usecase:'A new user signs up or starts a fresh chat. Call create() to provision an isolated memory context for them — all future add_prompt / recall calls reference this ID.',
    params:[],
    code:()=>
`conv_id = gm.conversations.create()

# Persist tied to your user session
db.save(user_id=current_user.id, conv_id=conv_id)
print(f"Ready: {conv_id}")`,
    execute: async () => {
      const r = await apiFetch('/conversations',{method:'POST',body:JSON.stringify({})});
      return r.json();
    }
  },
  {
    id:'conversations.list', ns:'conversations', label:'list', badge:'GET', http:'GET /conversations',
    desc:'Lists all conversations for your API key, ordered newest first, with node count and last topic recompute timestamp.',
    usecase:'Admin dashboard or observability view — see all active agent sessions, how many memory nodes each has accumulated, and when topics were last clustered.',
    params:[],
    code:()=>
`convs = gm.conversations.list()

for c in convs:
    print(f"{c['conversation_id'][:8]}…  nodes={c['node_count']}")`,
    execute: async () => {
      const r = await apiFetch('/conversations');
      return r.json();
    }
  },
  {
    id:'conversations.get_stats', ns:'conversations', label:'get_stats', badge:'GET', http:'GET /conversations/{conv_id}/stats',
    desc:'Returns conversation health: node count, topic count, dirty topics pending recompute, first/last activity timestamps, and embedding coverage.',
    usecase:'Before choosing a retrieval strategy, check conversation size. If node_count > 20, use recall(). For a fresh 3-message conversation, send the full history directly — recall adds latency for tiny contexts.',
    params:[],
    code:(cid)=>
`stats = gm.conversations.get_stats(conv_id="${cid}")

print(f"Nodes:  {stats['node_count']}")
print(f"Topics: {stats['topic_count']}")

# Adaptive retrieval strategy
if stats["node_count"] > 20:
    context = gm.memory.recall(conv_id, query=user_query, k=5)
else:
    context = gm.conversations.export(conv_id)`,
    execute: async (cid) => {
      const r = await apiFetch(`/conversations/${cid}/stats`);
      return r.json();
    }
  },
  {
    id:'conversations.export', ns:'conversations', label:'export', badge:'GET', http:'GET /conversations/{conv_id}/export',
    desc:'Exports all memory nodes ordered by index — full prompt, response, timestamps, and metadata for every turn.',
    usecase:'Build a fine-tuning dataset from your agent sessions, generate a readable transcript for the user, or run offline analytics on topic distribution across the conversation.',
    params:[],
    code:(cid)=>
`nodes = gm.conversations.export(conv_id="${cid}")
print(f"Exported {len(nodes)} nodes")

# Build fine-tuning pairs
dataset = [
    {"prompt": n["prompt"], "completion": n["response"]}
    for n in nodes
]`,
    execute: async (cid) => {
      const r = await apiFetch(`/conversations/${cid}/export`);
      return r.json();
    }
  },
  {
    id:'conversations.delete', ns:'conversations', label:'delete', badge:'DELETE', http:'DELETE /conversations/{conv_id}',
    desc:'Permanently deletes a conversation and all its memory nodes, topics, and Neptune graph edges. Irreversible. This demo creates a temp conversation then deletes it.',
    usecase:'A user deletes their account or a session expires. Clean up all associated memory — GDPR compliance, storage hygiene, or retiring expired agent sessions.',
    params:[],
    code:()=>
`# Hard-delete a conversation and all its graph data
gm.conversations.delete(conv_id=expired_session_conv_id)`,
    execute: async () => {
      const cr = await apiFetch('/conversations',{method:'POST',body:JSON.stringify({})});
      const {conversation_id} = await cr.json();
      await apiFetch(`/conversations/${conversation_id}`,{method:'DELETE'});
      return {deleted:conversation_id, status:'ok'};
    }
  },

  /* ── TOPICS ───────────────────────────────────────────── */
  {
    id:'topics.list_all', ns:'topics', label:'list_all', badge:'GET', http:'GET /topics?conversation_id=',
    desc:'Returns all topic clusters discovered via Louvain community detection — labels, descriptions, coherence scores, member message IDs, and status (active / dormant / resolved).',

/* ── Sidebar ──────────────────────────────────────────────────────── */
function renderSidebar() {
  const order  = ['memory','conversations','topics','auth','utils'];
  const labels = {memory:'Memory',conversations:'Conversations',topics:'Topics',auth:'Auth',utils:'Utils'};
  let html = '';
  for (const ns of order) {
    html += `<div class="pg-ns-head">${labels[ns]}</div>`;
    METHODS.filter(m=>m.ns===ns).forEach(m=>{
      const jt = m.jwt ? ' <span class="jwt-tag">JWT</span>' : '';
      html += `<div class="pg-item${m.id===state.method?' active':''}" onclick="selectMethod('${m.id}')">${m.label}${jt}</div>`;
    });
  }
  document.getElementById('methodList').innerHTML = html;
}

/* ── Panel rendering ──────────────────────────────────────────────── */
function renderParamInput(pr) {
  const c = cache();
  if (pr.type === 'cache_node') {
    const v = c.nodeId || '(loading…)';
    return `<div class="param-row"><span class="param-label">${pr.label}</span><span class="param-id">${v}</span></div>`;
  }
  if (pr.type === 'cache_topic') {
    const v = c.topicId || '(no topics yet — wait ~30s)';
    return `<div class="param-row"><span class="param-label">${pr.label}</span><span class="param-id">${v}</span></div>`;
  }
  if (pr.type === 'select') {
    const opts = pr.options.map(o=>`<option${o===(pr.def||pr.options[0])?' selected':''}>${o}</option>`).join('');
    return `<div class="param-row"><span class="param-label">${pr.label}</span><select class="param-input" id="p_${pr.id}" onchange="refreshCode()">${opts}</select></div>`;
  }
  if (pr.type === 'textarea') {
    const v = escHtml(state.conv==='conv1' ? (pr.defConv1||'') : (pr.defConv2||''));
    return `<div class="param-row" style="align-items:flex-start"><span class="param-label" style="padding-top:8px">${pr.label}</span><textarea class="param-input" id="p_${pr.id}" rows="3" style="resize:vertical" oninput="refreshCode()">${v}</textarea></div>`;
  }
  const v = state.conv==='conv1'
    ? (pr.defConv1!==undefined ? pr.defConv1 : (pr.def!==undefined?pr.def:''))
    : (pr.defConv2!==undefined ? pr.defConv2 : (pr.def!==undefined?pr.def:''));
  return `<div class="param-row"><span class="param-label">${pr.label}</span><input class="param-input" id="p_${pr.id}" type="${pr.type||'text'}" value="${escHtml(String(v))}" oninput="refreshCode()"/></div>`;
}

function collectParams(m) {
  const p={}, c=cache();
  (m.params||[]).forEach(pr=>{
    if (pr.type==='cache_node')  { p[pr.id]=c.nodeId;  return; }
    if (pr.type==='cache_topic') { p[pr.id]=c.topicId; return; }
    const el=document.getElementById(`p_${pr.id}`);
    p[pr.id]=el?el.value:'';
  });
  return p;
}

function refreshCode() {
  const m=METHODS.find(x=>x.id===state.method);
  if (!m) return;
  const el=document.getElementById('codeDisplay');
  if (el) el.innerHTML=hl(m.code(convId(),collectParams(m),cache()));
}

function renderPanel(m) {
  const jwtBlock = m.jwt ? `<div class="jwt-notice">⚠️ <strong>Requires Cognito JWT</strong> — use <code>Authorization: Bearer &lt;IdToken&gt;</code>, not an API key. Obtain via Cognito login. Run is disabled here.</div>` : '';
  const paramsHtml = (m.params||[]).length ? `<div class="params-wrap">${m.params.map(renderParamInput).join('')}</div>` : '';
  const btnOff = (m.jwt||!m.execute) ? ' disabled' : '';

  document.getElementById('methodPanel').innerHTML = `
    <h1 class="method-title">gm.${m.ns}.<span style="color:#00d97e">${m.label}</span><span class="badge b-${m.badge}">${m.badge}</span></h1>
    <p class="method-http">${m.http}</p>
    <p class="method-desc">${m.desc}</p>
    <div class="usecase-box"><div class="uc-label">💡 Use Case</div><p class="uc-text">${m.usecase}</p></div>
    <div class="sec-label">Code Example</div>
    <pre class="code-block" id="codeDisplay">${hl(m.code(convId(),collectParams(m),cache()))}</pre>
    ${paramsHtml}
    ${jwtBlock}
    <button class="run-btn" id="runBtn" onclick="runMethod()"${btnOff}><span>▶ Run</span></button>
    <div class="sec-label">Output</div>
    <div class="output-panel idle" id="outputPanel">Click ▶ Run to execute</div>
    <div id="extraOut"></div>`;
}

function selectMethod(id) {
  state.method=id;
  renderSidebar();
  const m=METHODS.find(x=>x.id===id);
  if (m) renderPanel(m);
}

function switchConv(key) {
  state.conv=key;
  selectMethod(state.method);
}

/* ── Run ──────────────────────────────────────────────────────────── */
async function runMethod() {
  const m=METHODS.find(x=>x.id===state.method);
  if (!m||!m.execute) return;
  const btn=document.getElementById('runBtn');
  const out=document.getElementById('outputPanel');
  const extra=document.getElementById('extraOut');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Running…';
  out.className='output-panel idle'; out.textContent='Running…'; extra.innerHTML='';
  try {
    const data=await m.execute(convId(),collectParams(m),cache());
    out.className='output-panel';
    out.textContent=JSON.stringify(data,null,2);
    if (m.extra==='token_savings' && data.token_count!==undefined) renderTokenSavings(data,extra);
  } catch(e) {
    out.className='output-panel err'; out.textContent=e.message;
  } finally {
    btn.disabled=false; btn.innerHTML='<span>▶ Run</span>';
  }
}

function renderTokenSavings(data,container) {
  const gm=data.token_count||0;
  const full=data._fullEst||7500;
  const pct=Math.max(0,Math.min(100,Math.round((1-gm/full)*100)));
  const gmPct=Math.round((gm/full)*100);
  container.innerHTML=`
    ${data.context?`<div class="context-label">Context passed to your LLM</div><div class="context-box">${escHtml(data.context)}</div>`:''}
    <div class="token-savings">
      <div class="ts-title">Token Savings vs Full History</div>
      <div class="ts-row">
        <div class="ts-row-label"><span>Full history (estimated)</span><span>${full.toLocaleString()} tokens</span></div>
        <div class="ts-track"><div class="ts-fill" style="width:100%;background:#d1fae5;color:#065f46"> </div></div>
      </div>
      <div class="ts-row">
        <div class="ts-row-label"><span>GraphMem recall output</span><span>${gm.toLocaleString()} tokens</span></div>
        <div class="ts-track"><div class="ts-fill" style="width:${gmPct}%">${gmPct>15?gmPct+'%':''}</div></div>
      </div>
      <div class="ts-savings">🎯 ${pct}% token reduction — same relevant context, far lower cost</div>
    </div>`;
}

/* ── Init ─────────────────────────────────────────────────────────── */
async function init() {
  document.getElementById('apiKeyInput').value=CONF.demoKey;
  for (const [key,conv] of [['conv1',CONF.conv1],['conv2',CONF.conv2]]) {
    try {
      const [nR,tR]=await Promise.all([
        apiFetch(`/conversations/${conv.id}/export`),
        apiFetch(`/topics?conversation_id=${conv.id}`)
      ]);
      const nodes=await nR.json(), topics=await tR.json();
      const nArr=Array.isArray(nodes)?nodes:[];
      const tArr=Array.isArray(topics)?topics:[];
      state.cache[key]={
        nodes:nArr, topics:tArr,
        nodeId: nArr.find(n=>n.status==='complete')?.memory_id||nArr[0]?.memory_id||null,
        topicId: tArr[0]?.topic_id||null
      };
    } catch(e){ console.warn('cache fail',key,e.message); }
  }
  renderSidebar();
  selectMethod('memory.recall');
}

init();
</script>
