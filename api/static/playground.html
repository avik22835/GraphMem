<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Playground — GraphMem</title>
  <link rel="stylesheet" href="/static/css/styles.css"/>
  <style>
    /* ── Layout override ─────────────────────────────────────────── */
    body { overflow: hidden; }
    .pg-wrap {
      position: fixed !important;
      top: var(--nav-h) !important;
      left: 0; right: 0; bottom: 0;
      display: flex !important;
      padding: 0 !important;
      margin: 0;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .pg-sidebar {
      width: 232px; min-width: 232px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pg-sidebar-top {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border);
    }
    .pg-field-label {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .9px; margin-bottom: 5px;
    }
    .pg-api-key, .pg-conv-select {
      width: 100%; box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--border-2);
      border-radius: 5px; color: var(--text);
      font-size: 11px; padding: 6px 9px;
      font-family: var(--mono);
    }
    .pg-api-key { margin-bottom: 10px; }
    .pg-api-key::placeholder { color: var(--text-3); }
    .pg-conv-select { cursor: pointer; }
    .pg-get-key {
      display: block; margin-top: 7px;
      font-size: 11px; color: var(--accent);
      text-decoration: none; font-weight: 600;
    }
    .pg-get-key:hover { opacity: .8; }
    .pg-method-list { flex: 1; overflow-y: auto; padding: 4px 0 24px; }
    .pg-ns-head {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .9px;
      padding: 14px 14px 4px;
    }
    .pg-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px 5px 20px;
      font-size: 12.5px; color: var(--text-2);
      cursor: pointer; border-left: 2px solid transparent;
      transition: all .1s; font-family: var(--mono);
      user-select: none;
    }
    .pg-item:hover { color: var(--text); background: var(--surface-2); }
    .pg-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(0,255,136,.04); }
    .jwt-tag {
      font-size: 9px; background: rgba(255,204,68,.12); color: var(--yellow);
      border-radius: 3px; padding: 1px 4px; font-family: var(--font);
    }

    /* ── Main panel ──────────────────────────────────────────────── */
    .pg-main {
      flex: 1; overflow-y: auto;
      padding: 32px 44px 72px;
      background: var(--bg);
    }
    .method-title {
      font-size: 20px; font-weight: 700; color: var(--text);
      margin: 0 0 3px; font-family: var(--mono); letter-spacing: -.02em;
    }
    .method-http { font-size: 12px; color: var(--text-3); margin: 0 0 20px; font-family: var(--mono); }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 3px; margin-left: 8px;
      vertical-align: middle; position: relative; top: -2px;
    }
    .b-POST   { background: rgba(0,255,136,.12); color: var(--accent); }
    .b-GET    { background: rgba(91,154,245,.12); color: var(--blue); }
    .b-DELETE { background: rgba(255,85,85,.12); color: var(--red); }
    .method-desc { font-size: 14px; color: var(--text-2); line-height: 1.65; margin-bottom: 16px; }
    .usecase-box {
      background: rgba(0,255,136,.04);
      border: 1px solid rgba(0,255,136,.15);
      border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 26px;
    }
    .uc-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .8px; color: var(--accent); margin-bottom: 5px;
    }
    .uc-text { font-size: 13px; color: rgba(0,255,136,.7); margin: 0; line-height: 1.55; }
    .sec-label {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .9px; margin: 0 0 8px;
    }
    pre.code-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px 18px;
      font-family: var(--mono); font-size: 12.5px;
      line-height: 1.75; color: var(--text);
      overflow-x: auto; margin: 0 0 20px; white-space: pre;
    }
    .ck { color: #ff7b72; } .cs { color: #79c0ff; }
    .cc { color: var(--text-3); } .cn { color: #f2cc60; }
    .params-wrap { margin-bottom: 20px; }
    .param-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .param-label { font-size: 12px; font-weight: 600; color: var(--text-2); min-width: 100px; }
    .param-input {
      flex: 1; border: 1px solid var(--border-2); border-radius: 5px;
      padding: 6px 10px; font-size: 13px; font-family: var(--mono);
      color: var(--text); background: var(--surface);
      transition: border-color .12s;
    }
    .param-input:focus { outline: none; border-color: var(--accent); }
    .param-input[type=number] { max-width: 90px; }
    .param-id {
      flex: 1; font-size: 11px; font-family: var(--mono); color: var(--text-3);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 6px 10px; word-break: break-all;
    }
    .run-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #0c0c0c;
      border: none; border-radius: 6px; padding: 9px 22px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: all .12s; margin-bottom: 24px;
    }
    .run-btn:hover { opacity: .88; transform: translateY(-1px); }
    .run-btn:active { transform: none; }
    .run-btn:disabled { background: var(--text-3); color: var(--surface); cursor: not-allowed; transform: none; }
    .spinner {
      width: 13px; height: 13px; border: 2px solid #0c0c0c;
      border-top-color: transparent; border-radius: 50%;
      animation: spin .65s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .jwt-notice {
      background: rgba(255,204,68,.06); border: 1px solid rgba(255,204,68,.2);
      border-radius: 7px; padding: 11px 14px;
      font-size: 13px; color: var(--yellow); margin-bottom: 18px;
    }
    .nokey-notice {
      display: none; background: rgba(91,154,245,.06);
      border: 1px solid rgba(91,154,245,.2); border-radius: 7px;
      padding: 11px 14px; font-size: 13px; color: var(--blue); margin-bottom: 18px;
    }
    .nokey-notice a { color: var(--accent); font-weight: 600; }

    /* ── Output ──────────────────────────────────────────────────── */
    .output-tabs {
      display: flex; gap: 0; margin-bottom: 0;
      border-bottom: 1px solid var(--border);
    }
    .output-tab {
      padding: 6px 14px; font-size: 12px; font-weight: 600;
      color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all .1s; user-select: none;
    }
    .output-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .output-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 8px 8px;
      padding: 14px 18px; font-family: var(--mono);
      font-size: 12.5px; line-height: 1.6; color: var(--text);
      max-height: 380px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-word;
    }
    .output-wrap { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; }
    .output-wrap .output-tabs { border-radius: 8px 8px 0 0; border-bottom: 1px solid var(--border); }
    .output-panel.idle { color: var(--text-3); font-style: italic; white-space: normal; }
    .output-panel.err  { border-top: 1px solid rgba(255,85,85,.3); color: var(--red); }

    /* Message cards */
    .msg-cards { padding: 14px; }
    .msg-card {
      border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 10px; overflow: hidden;
    }
    .msg-card:last-child { margin-bottom: 0; }
    .msg-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px; background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px;
    }
    .msg-card-header .tag-user { color: var(--blue); }
    .msg-card-header .tag-resp { color: var(--accent); }
    .msg-card-score { color: var(--text-3); font-weight: 400; font-family: var(--mono); }
    .msg-prompt, .msg-response {
      padding: 9px 12px; font-size: 13px; line-height: 1.55; color: var(--text-2);
    }
    .msg-prompt { color: var(--text); background: transparent; }
    .msg-divider { height: 1px; background: var(--border); margin: 0; }

    /* Token savings */
    .token-savings {
      margin-top: 16px; padding: 16px 18px;
      background: rgba(0,255,136,.04);
      border: 1px solid rgba(0,255,136,.12);
      border-radius: 8px;
    }
    .ts-title { font-size: 12px; font-weight: 700; color: var(--accent); margin: 0 0 14px; }
    .ts-row { margin-bottom: 10px; }
    .ts-row-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
    .ts-track { height: 20px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
    .ts-fill {
      height: 100%; background: var(--accent); border-radius: 4px;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 7px; font-size: 10px; font-weight: 700; color: #0c0c0c;
      transition: width .6s ease;
    }
    .ts-full-bar { height: 100%; background: var(--border-2); border-radius: 4px; }
    .ts-savings { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 10px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-icon">⬡</span>GraphMem</a>
    <a href="/reference" class="nav-link">Docs</a>
    <a href="/reference" class="nav-link">Reference</a>
    <a href="/playground" class="nav-link active">Playground</a>
    <a href="https://github.com/avik22835/graphmem" class="nav-link" target="_blank" rel="noopener">GitHub ↗</a>
    <div class="nav-right">
      <div class="nav-divider"></div>
      <a href="/login" class="nav-link" id="navLogin">Log in</a>
      <a href="/signup" class="btn btn-ghost btn-sm">Get API Key</a>
    </div>
  </div>
</nav>

<div class="pg-wrap">
  <aside class="pg-sidebar">
    <div class="pg-sidebar-top">
      <div class="pg-field-label">API Key</div>
      <input class="pg-api-key" id="apiKeyInput" type="password"
             placeholder="gm_sk_… — paste your key" autocomplete="off"/>
      <div class="pg-field-label" style="margin-top:10px">Demo Conversation</div>
      <select class="pg-conv-select" id="convSelect" onchange="switchConv(this.value)">
        <option value="conv2">SaaS App Build (auth → payments → backend)</option>
        <option value="conv1">Multi-topic Chat (cooking → travel → coding)</option>
      </select>
      <a href="/signup" class="pg-get-key">→ Get your free API key</a>
    </div>
    <div class="pg-method-list" id="methodList"></div>
  </aside>

  <main class="pg-main" id="methodPanel">
    <div style="color:var(--text-3);padding-top:40px;font-size:14px">Loading demo data…</div>
  </main>
</div>

<script src="/static/js/auth.js"></script>
<script>
/* ── Config ──────────────────────────────────────────────────────── */
const CONF = {
  conv1: { id: '0eaf5486-63c6-4f5c-a4d8-5c761f1fa91d', label: 'Multi-topic Chat' },
  conv2: { id: '0fd00ae3-5ffe-48f9-a3dc-6ac2e6badb16', label: 'SaaS App Build'   },
};

const state = {
  conv: 'conv2', method: 'memory.recall', outputTab: 'cards',
  cache: {
    conv1: { nodes:[], topics:[], nodeId:null, topicId:null },
    conv2: { nodes:[], topics:[], nodeId:null, topicId:null }
  }
};

/* ── Helpers ─────────────────────────────────────────────────────── */
const apiKey  = () => document.getElementById('apiKeyInput').value.trim();
const convId  = () => CONF[state.conv].id;
const cache   = () => state.cache[state.conv];
const hasKey  = () => !!apiKey();

async function apiFetch(path, opts={}) {
  const key = apiKey();
  if (!key && path !== '/health') throw new Error('No API key — paste your key in the sidebar or get one free at /signup');
  const h = { 'Content-Type': 'application/json' };
  if (key) h['X-API-Key'] = key;
  const r = await fetch(path, { ...opts, headers: { ...h, ...(opts.headers||{}) } });
  if (!r.ok) { const t = await r.text(); throw new Error(`${r.status} — ${t}`); }
  return r;
}

function hl(code) {
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/"([^"\n]*)"/g,  '<span class="cs">"$1"</span>');
  s = s.replace(/'([^'\n]*)'/g,  "<span class=\"cs\">'$1'</span>");
  s = s.replace(/(#[^\n]*)/g,    '<span class="cc">$1</span>');
  s = s.replace(/\b(import|from|await|async|def|return|for|in|if|else|True|False|None|print|len|not)\b/g,
                '<span class="ck">$1</span>');
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="cn">$1</span>');
  return s;
}
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Methods ─────────────────────────────────────────────────────── */
const METHODS = [
  /* ── MEMORY ──────────────────────────────────────────── */
  {
    id:'memory.recall', ns:'memory', label:'recall', badge:'POST', http:'POST /memory/recall',
    desc:'Retrieves the k most semantically relevant memory nodes for a query using two-layer retrieval: pgvector HNSW cosine search (Layer 1) re-ranked by Neptune graph neighbourhood edges (Layer 2).',
    usecase:'Message 51 arrives in your chatbot. Instead of sending all 50 prior exchanges — often thousands of tokens — to your LLM, call recall() to fetch only the most relevant nodes. Focused context, fraction of the cost.',
    params:[
      {id:'query',label:'Query',type:'text',
       defConv1:'What cooking techniques did we discuss?',
       defConv2:'How should I handle JWT token expiry?'},
      {id:'k',label:'k',type:'number',def:5}
    ],
    code:(cid,p)=>
`import graphmem

gm = graphmem.GraphMemClient(api_key="gm_sk_...")

result = gm.memory.recall(
    conv_id="${cid}",
    query="${p.query}",
    k=${p.k},
    strategy="semantic",
)

# Feed to your LLM instead of full history
llm_context = result.context
print(f"GraphMem: {result.token_count} tokens")`,
    execute: async (cid,p) => {
      const sR = await apiFetch(`/conversations/${cid}/stats`);
      const stats = await sR.json();
      const r = await apiFetch('/memory/recall',{
        method:'POST',
        body:JSON.stringify({conversation_id:cid,query:p.query,k:parseInt(p.k),strategy:'semantic'})
      });
      const d = await r.json();
      d._fullEst = (stats.node_count||50)*150;
      return d;
    },
    extra:'recall_view'
  },
  {
    id:'memory.add_prompt', ns:'memory', label:'add_prompt', badge:'POST', http:'POST /memory/prompt',
    desc:'Logs a user prompt as a new pending memory node. Returns a memory_id — store it and pass to add_response() after your LLM replies to complete the node.',
    usecase:'Your agent receives a user message. Before forwarding it to your LLM, log it with add_prompt() so every turn is captured in the memory graph. Nothing is ever lost.',
    params:[
      {id:'content',label:'Content',type:'text',
       defConv1:'How do I make crème brûlée at home?',
       defConv2:'How do I rotate refresh tokens safely?'}
    ],
    code:(cid,p)=>
`memory_id = gm.memory.add_prompt(
    conv_id="${cid}",
    content="${p.content}",
)
# Save memory_id — pass it to add_response()
print(f"Node created: {memory_id}")`,
    execute: async (cid,p) => {
      const r = await apiFetch('/memory/prompt',{
        method:'POST', body:JSON.stringify({conversation_id:cid,content:p.content})
      });
      return r.json();
    }
  },
  {
    id:'memory.add_response', ns:'memory', label:'add_response', badge:'POST', http:'POST /memory/{memory_id}/response',
    desc:"Attaches your LLM's response to a pending node, marking it complete. Triggers the async pipeline: embedding computation → Neptune edge creation → topic recompute queue.",
    usecase:'Your LLM has replied. Call add_response() to seal the node. The node worker queues embedding computation immediately — this turn becomes searchable via recall() within seconds.',
    params:[
      {id:'content',label:'Response',type:'text',
       defConv1:'Crème brûlée requires a kitchen torch for the caramelized sugar top. Use heavy cream, not milk.',
       defConv2:'On each use of the refresh token, issue a brand new one and invalidate the old one (rotation pattern).'}
    ],
    code:(cid,p)=>
`# memory_id came from add_prompt()
gm.memory.add_response(
    memory_id=memory_id,
    conv_id="${cid}",
    content=llm_response,
)
# Node is now complete — embedding + graph edges queued`,
    execute: async (cid,p) => {
      const pR = await apiFetch('/memory/prompt',{
        method:'POST', body:JSON.stringify({conversation_id:cid,content:'Demo prompt for add_response example'})
      });
      const {memory_id} = await pR.json();
      const r = await apiFetch(`/memory/${memory_id}/response`,{
        method:'POST', body:JSON.stringify({conversation_id:cid,content:p.content})
      });
      return {memory_id, ...(await r.json())};
    }
  },
  {
    id:'memory.get', ns:'memory', label:'get', badge:'GET', http:'GET /memory/{memory_id}',
    desc:'Fetches a single memory node by ID — prompt, response, status, timestamps, and metadata.',
    usecase:"You stored a memory_id alongside a session. Retrieve it later to inspect what was logged, verify embedding status (status: complete means it's in the graph), or display the original exchange to the user.",
    params:[{id:'memory_id',label:'memory_id',type:'cache_node'}],
    code:(cid,p,c)=>
`node = gm.memory.get(memory_id="${c.nodeId||'<memory_id>'}")

print(node["prompt"])
print(node["response"])
print(node["status"])   # "complete" once embedded and in graph`,
    execute: async (cid,p,c) => {
      if (!c.nodeId) throw new Error('No nodes cached. Wait for embedding to complete.');
      const r = await apiFetch(`/memory/${c.nodeId}`);
      return r.json();
    }
  },
  {
    id:'memory.get_neighbours', ns:'memory', label:'get_neighbours', badge:'GET', http:'GET /memory/{memory_id}/neighbours',
    desc:'Returns memory nodes semantically adjacent to a given node in the Neptune cosine similarity graph, ranked by edge weight.',
    usecase:'"Show me more context around this message." get_neighbours() follows Neptune graph edges — surfaces all semantically related exchanges regardless of when they occurred.',
    params:[
      {id:'memory_id',label:'memory_id',type:'cache_node'},
      {id:'threshold',label:'Threshold',type:'number',def:0.7}
    ],
    code:(cid,p,c)=>
`neighbours = gm.memory.get_neighbours(
    memory_id="${c.nodeId||'<memory_id>'}",
    threshold=${p.threshold},
    limit=10,
    order="relevance",
)
for n in neighbours:
    print(f"[{n['edge_weight']:.2f}] {n['prompt'][:80]}")`,
    execute: async (cid,p,c) => {
      if (!c.nodeId) throw new Error('No nodes cached. Wait for embedding to complete.');
      const r = await apiFetch(`/memory/${c.nodeId}/neighbours?threshold=${p.threshold}&limit=10&order=relevance`);
      return r.json();
    }
  },
  {
    id:'memory.add_batch', ns:'memory', label:'add_batch', badge:'POST', http:'POST /memory/batch',
    desc:'Bulk-inserts up to 100 complete prompt+response pairs in one request. All items are marked complete immediately and queued for embedding.',
    usecase:"Onboarding a user who already has chat history in your existing system. Instead of 200 individual API calls, batch-import their entire history and let GraphMem build the semantic graph asynchronously.",
    params:[],
    code:(cid)=>
`memory_ids = gm.memory.add_batch(items=[
    {
        "conversation_id": "${cid}",
        "prompt": "What's the difference between stateless and stateful auth?",
        "response": "Stateless auth (JWT) stores session in the token — no server-side state.",
    },
    {
        "conversation_id": "${cid}",
        "prompt": "Which is better for microservices?",
        "response": "Stateless JWT scales horizontally without a shared session store.",
    },
])
print(f"Imported {len(memory_ids)} nodes")`,
    execute: async (cid) => {
      const r = await apiFetch('/memory/batch',{
        method:'POST',
        body:JSON.stringify({items:[
          {conversation_id:cid,prompt:"What's the difference between stateless and stateful auth?",response:"Stateless auth (JWT) stores session in the token — no server-side state needed."},
          {conversation_id:cid,prompt:"Which is better for microservices?",response:"Stateless JWT scales horizontally without a shared session store."},
        ]})
      });
      return r.json();
    }
  },

  /* ── CONVERSATIONS ────────────────────────────────────── */
  {
    id:'conversations.create', ns:'conversations', label:'create', badge:'POST', http:'POST /conversations',
    desc:'Creates a new empty conversation context and returns a conversation_id. Store this ID tied to your user or session.',
    usecase:'A new user signs up or starts a fresh chat. Call create() to provision an isolated memory context for them — all future add_prompt / recall calls reference this ID.',
    params:[],
    code:()=>
`conv_id = gm.conversations.create()

# Persist tied to your user session
db.save(user_id=current_user.id, conv_id=conv_id)
print(f"Ready: {conv_id}")`,
    execute: async () => {
      const r = await apiFetch('/conversations',{method:'POST',body:JSON.stringify({})});
      return r.json();
    }
  },
  {
    id:'conversations.list', ns:'conversations', label:'list', badge:'GET', http:'GET /conversations',
    desc:'Lists all conversations for your API key, ordered newest first, with node count and last topic recompute timestamp.',
    usecase:'Admin dashboard or observability view — see all active agent sessions, how many memory nodes each has accumulated, and when topics were last clustered.',
    params:[],
    code:()=>
`convs = gm.conversations.list()

for c in convs:
    print(f"{c['conversation_id'][:8]}…  nodes={c['node_count']}")`,
    execute: async () => {
      const r = await apiFetch('/conversations');
      return r.json();
    }
  },
  {

/* ── Sidebar ──────────────────────────────────────────────────────── */
function renderSidebar() {
  const order  = ['memory','conversations','topics','auth','utils'];
  const labels = {memory:'Memory',conversations:'Conversations',topics:'Topics',auth:'Auth',utils:'Utils'};
  let html = '';
  for (const ns of order) {
    html += `<div class="pg-ns-head">${labels[ns]}</div>`;
    METHODS.filter(m=>m.ns===ns).forEach(m=>{
      const jt = m.jwt ? ' <span class="jwt-tag">JWT</span>' : '';
      html += `<div class="pg-item${m.id===state.method?' active':''}" onclick="selectMethod('${m.id}')">${m.label}${jt}</div>`;
    });
  }
  document.getElementById('methodList').innerHTML = html;
}

/* ── Panel ────────────────────────────────────────────────────────── */
function renderParamInput(pr) {
  const c = cache();
  if (pr.type === 'cache_node') {
    const v = c.nodeId || '(loading…)';
    return `<div class="param-row"><span class="param-label">${pr.label}</span><span class="param-id">${escHtml(v)}</span></div>`;
  }
  if (pr.type === 'cache_topic') {
    const v = c.topicId || '(no topics yet — wait ~30s)';
    return `<div class="param-row"><span class="param-label">${pr.label}</span><span class="param-id">${escHtml(v)}</span></div>`;
  }
  if (pr.type === 'select') {
    const opts = pr.options.map(o=>`<option${o===(pr.def||pr.options[0])?' selected':''}>${o}</option>`).join('');
    return `<div class="param-row"><span class="param-label">${pr.label}</span><select class="param-input" id="p_${pr.id}" onchange="refreshCode()">${opts}</select></div>`;
  }
  if (pr.type === 'textarea') {
    const v = escHtml(state.conv==='conv1' ? (pr.defConv1||'') : (pr.defConv2||''));
    return `<div class="param-row" style="align-items:flex-start"><span class="param-label" style="padding-top:8px">${pr.label}</span><textarea class="param-input" id="p_${pr.id}" rows="3" style="resize:vertical" oninput="refreshCode()">${v}</textarea></div>`;
  }
  const v = state.conv==='conv1'
    ? (pr.defConv1!==undefined ? pr.defConv1 : (pr.def!==undefined?pr.def:''))
    : (pr.defConv2!==undefined ? pr.defConv2 : (pr.def!==undefined?pr.def:''));
  return `<div class="param-row"><span class="param-label">${pr.label}</span><input class="param-input" id="p_${pr.id}" type="${pr.type||'text'}" value="${escHtml(String(v))}" oninput="refreshCode()"/></div>`;
}

function collectParams(m) {
  const p={}, c=cache();
  (m.params||[]).forEach(pr=>{
    if (pr.type==='cache_node')  { p[pr.id]=c.nodeId;  return; }
    if (pr.type==='cache_topic') { p[pr.id]=c.topicId; return; }
    const el=document.getElementById(`p_${pr.id}`);
    p[pr.id]=el?el.value:'';
  });
  return p;
}

function refreshCode() {
  const m=METHODS.find(x=>x.id===state.method);
  if (!m) return;
  const el=document.getElementById('codeDisplay');
  if (el) el.innerHTML=hl(m.code(convId(),collectParams(m),cache()));
}

function renderPanel(m) {
  const jwtBlock = m.jwt ? `<div class="jwt-notice">⚠ <strong>Requires Cognito JWT</strong> — use <code>Authorization: Bearer &lt;IdToken&gt;</code>. Obtain by logging in at <a href="/login" style="color:var(--yellow);">/login</a>. Run is disabled here.</div>` : '';
  const noKeyBlock = (!m.jwt && m.execute) ? `<div class="nokey-notice" id="noKeyNotice">Enter your API key above to run this method — <a href="/signup">get a free key →</a></div>` : '';
  const paramsHtml = (m.params||[]).length ? `<div class="params-wrap">${m.params.map(renderParamInput).join('')}</div>` : '';
  const btnOff = (m.jwt||!m.execute) ? ' disabled' : '';

  const tabsHtml = m.extra === 'recall_view' ? `
    <div class="output-wrap">
      <div class="output-tabs">
        <div class="output-tab active" id="tabCards" onclick="switchOutputTab('cards')">Messages</div>
        <div class="output-tab" id="tabJson"  onclick="switchOutputTab('json')">JSON</div>
      </div>
      <div class="output-panel idle" id="outputPanel">Click ▶ Run to execute</div>
    </div>` : `
    <div class="output-wrap">
      <div class="output-tabs"><div class="output-tab active">Output</div></div>
      <div class="output-panel idle" id="outputPanel">Click ▶ Run to execute</div>
    </div>`;

  document.getElementById('methodPanel').innerHTML = `
    <h1 class="method-title">gm.${m.ns}.<span style="color:var(--accent)">${m.label}</span><span class="badge b-${m.badge}">${m.badge}</span></h1>
    <p class="method-http">${m.http}</p>
    <p class="method-desc">${m.desc}</p>
    <div class="usecase-box"><div class="uc-label">💡 Use Case</div><p class="uc-text">${m.usecase}</p></div>
    <div class="sec-label">Code Example</div>
    <pre class="code-block" id="codeDisplay">${hl(m.code(convId(),collectParams(m),cache()))}</pre>
    ${paramsHtml}
    ${jwtBlock}${noKeyBlock}
    <button class="run-btn" id="runBtn" onclick="runMethod()"${btnOff}><span>▶ Run</span></button>
    <div class="sec-label">Output</div>
    ${tabsHtml}
    <div id="extraOut"></div>`;

  updateNoKeyNotice();
}

function updateNoKeyNotice() {
  const el = document.getElementById('noKeyNotice');
  const btn = document.getElementById('runBtn');
  if (!el) return;
  const k = hasKey();
  el.style.display = k ? 'none' : 'block';
  if (btn) btn.disabled = !k;
}

function switchOutputTab(tab) {
  state.outputTab = tab;
  document.getElementById('tabCards')?.classList.toggle('active', tab==='cards');
  document.getElementById('tabJson')?.classList.toggle('active', tab==='json');
  const out = document.getElementById('outputPanel');
  if (out && out._data) renderOutput(out._data, out);
}

function selectMethod(id) {
  state.method=id;
  state.outputTab='cards';
  renderSidebar();
  const m=METHODS.find(x=>x.id===id);
  if (m) renderPanel(m);
}

function switchConv(key) {
  state.conv=key;
  selectMethod(state.method);
}

/* ── Output rendering ─────────────────────────────────────────────── */
function renderOutput(data, panel) {
  const m = METHODS.find(x=>x.id===state.method);
  panel._data = data;

  if (m?.extra === 'recall_view' && state.outputTab === 'cards') {
    const nodes = data.nodes || data.messages || data.items || [];
    if (!nodes.length) {
      panel.className = 'output-panel idle';
      panel.innerHTML = 'No nodes returned.';
      return;
    }
    panel.className = 'output-panel';
    panel.style.whiteSpace = 'normal';
    panel.innerHTML = '<div class="msg-cards">' + nodes.map((n,i) => {
      const score = n.score !== undefined ? `<span class="msg-card-score">score: ${Number(n.score).toFixed(3)}</span>` : '';
      return `<div class="msg-card">
        <div class="msg-card-header">
          <span class="tag-user">Turn ${(n.index||i+1)}</span>${score}
        </div>
        <div class="msg-prompt">${escHtml(n.prompt||'')}</div>
        <div class="msg-divider"></div>
        <div class="msg-response">${escHtml(n.response||'')}</div>
      </div>`;
    }).join('') + '</div>';
  } else {
    panel.className = 'output-panel';
    panel.style.whiteSpace = 'pre-wrap';
    panel.textContent = JSON.stringify(data, null, 2);
  }
}

/* ── Run ──────────────────────────────────────────────────────────── */
async function runMethod() {
  const m=METHODS.find(x=>x.id===state.method);
  if (!m||!m.execute) return;
  const btn=document.getElementById('runBtn');
  const out=document.getElementById('outputPanel');
  const extra=document.getElementById('extraOut');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Running…';
  out.className='output-panel idle';
  out.textContent='Running…';
  out.style.whiteSpace='normal';
  extra.innerHTML='';
  try {
    const data=await m.execute(convId(),collectParams(m),cache());
    out.className='output-panel';
    renderOutput(data, out);
    if (m.extra==='recall_view' && data.token_count!==undefined) renderTokenSavings(data,extra);
  } catch(e) {
    out.className='output-panel err';
    out.style.whiteSpace='pre-wrap';
    out.textContent=e.message;
  } finally {
    btn.disabled=false; btn.innerHTML='<span>▶ Run</span>';
  }
}

function renderTokenSavings(data,container) {
  const gm=data.token_count||0;
  const full=data._fullEst||7500;
  const pct=Math.max(0,Math.min(100,Math.round((1-gm/full)*100)));
  const gmPct=Math.round((gm/full)*100);
  container.innerHTML=`
    <div class="token-savings">
      <div class="ts-title">Token savings vs full history</div>
      <div class="ts-row">
        <div class="ts-row-label"><span>Full history (est.)</span><span>${full.toLocaleString()} tokens</span></div>
        <div class="ts-track"><div class="ts-full-bar"></div></div>
      </div>
      <div class="ts-row">
        <div class="ts-row-label"><span>GraphMem recall output</span><span>${gm.toLocaleString()} tokens</span></div>
        <div class="ts-track"><div class="ts-fill" style="width:${gmPct}%">${gmPct>12?gmPct+'%':''}</div></div>
      </div>
      <div class="ts-savings">↓ ${pct}% token reduction — same relevant context, far lower cost</div>
    </div>`;
}

/* ── Init ─────────────────────────────────────────────────────────── */
async function init() {
  // Read API key from localStorage (set after login/dashboard)
  const storedKey = gmGetApiKey ? gmGetApiKey() : localStorage.getItem('gm_api_key');
  if (storedKey) document.getElementById('apiKeyInput').value = storedKey;

  // Update nav: show email if logged in
  if (typeof gmIsAuthenticated === 'function' && gmIsAuthenticated()) {
    const navLogin = document.getElementById('navLogin');
    if (navLogin) navLogin.textContent = gmGetEmail ? gmGetEmail() : 'Account';
  }

  // Save key on change
  document.getElementById('apiKeyInput').addEventListener('input', () => {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) localStorage.setItem('gm_api_key', k);
    updateNoKeyNotice();
  });

  // Prefetch demo conversation data
  for (const [key,conv] of [['conv1',CONF.conv1],['conv2',CONF.conv2]]) {
    try {
      const sKey = 'gm_demo_' + key;
      const cached = sessionStorage.getItem(sKey);
      if (cached) {
        Object.assign(state.cache[key], JSON.parse(cached));
        continue;
      }
      // Only prefetch if a key is available
      if (!apiKey()) continue;
      const [nR,tR]=await Promise.all([
        apiFetch(`/conversations/${conv.id}/export`),
        apiFetch(`/topics?conversation_id=${conv.id}`)
      ]);
      const nodes=await nR.json(), topics=await tR.json();
      const nArr=Array.isArray(nodes)?nodes:[];
      const tArr=Array.isArray(topics)?topics:[];
      const cacheObj = {
        nodes:nArr, topics:tArr,
        nodeId: nArr.find(n=>n.status==='complete')?.memory_id||nArr[0]?.memory_id||null,
        topicId: tArr[0]?.topic_id||null
      };
      Object.assign(state.cache[key], cacheObj);
      sessionStorage.setItem(sKey, JSON.stringify(cacheObj));
    } catch(e){ console.warn('cache fail',key,e.message); }
  }

  renderSidebar();
  selectMethod('memory.recall');
}

init();
</script>
</body>
</html>
