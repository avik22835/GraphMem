<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Playground — GraphMem</title>
  <link rel="stylesheet" href="/static/css/styles.css"/>
  <style>
    body { overflow: hidden; }
    .pg-wrap {
      position: fixed !important;
      top: var(--nav-h) !important;
      left: 0; right: 0; bottom: 0;
      display: flex !important;
      padding: 0 !important;
    }

    /* Sidebar */
    .pg-sidebar {
      width: 210px; min-width: 210px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pg-sidebar-top { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .pg-field-label {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .9px; margin-bottom: 6px;
    }
    .pg-conv-select {
      width: 100%; background: var(--bg); border: 1px solid var(--border-2);
      border-radius: 5px; color: var(--text); font-size: 12px;
      padding: 6px 9px; cursor: pointer; font-family: var(--font);
    }
    .pg-method-list { flex: 1; overflow-y: auto; padding: 4px 0 24px; }
    .pg-ns-head {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .9px; padding: 14px 14px 4px;
    }
    .pg-item {
      padding: 5px 14px 5px 20px; font-size: 12.5px; color: var(--text-2);
      cursor: pointer; border-left: 2px solid transparent;
      transition: all .1s; font-family: var(--mono); user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    .pg-item:hover { color: var(--text); background: var(--surface-2); }
    .pg-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(0,255,136,.04); }
    .jwt-tag {
      font-size: 9px; background: rgba(255,204,68,.12); color: var(--yellow);
      border-radius: 3px; padding: 1px 4px; font-family: var(--font);
    }

    /* Main */
    .pg-main { flex: 1; overflow-y: auto; padding: 30px 44px 72px; background: var(--bg); }
    .method-title {
      font-size: 20px; font-weight: 700; color: var(--text);
      margin: 0 0 3px; font-family: var(--mono); letter-spacing: -.02em;
    }
    .method-http { font-size: 12px; color: var(--text-3); margin: 0 0 18px; font-family: var(--mono); }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 3px; margin-left: 8px;
      vertical-align: middle; position: relative; top: -2px;
    }
    .b-POST   { background: rgba(0,255,136,.12); color: var(--accent); }
    .b-GET    { background: rgba(91,154,245,.12); color: var(--blue); }
    .b-DELETE { background: rgba(255,85,85,.12);  color: var(--red); }
    .method-desc { font-size: 14px; color: var(--text-2); line-height: 1.65; margin-bottom: 16px; }
    .usecase-box {
      background: rgba(0,255,136,.04); border: 1px solid rgba(0,255,136,.14);
      border-left: 3px solid var(--accent); border-radius: 8px;
      padding: 11px 15px; margin-bottom: 24px;
    }
    .uc-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); margin-bottom: 4px; }
    .uc-text  { font-size: 13px; color: rgba(0,255,136,.65); margin: 0; line-height: 1.55; }
    .sec-label {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .9px; margin: 0 0 8px;
    }
    pre.code-block {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 15px 18px; font-family: var(--mono); font-size: 12.5px;
      line-height: 1.75; color: var(--text); overflow-x: auto; margin: 0 0 20px; white-space: pre;
    }
    .ck { color: #ff7b72; } .cs { color: #79c0ff; }
    .cc { color: var(--text-3); } .cn { color: #f2cc60; }

    /* Params */
    .params-wrap { margin-bottom: 18px; }
    .param-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .param-label { font-size: 12px; font-weight: 600; color: var(--text-2); min-width: 90px; }
    .param-input {
      flex: 1; border: 1px solid var(--border-2); border-radius: 5px;
      padding: 6px 10px; font-size: 13px; font-family: var(--mono);
      color: var(--text); background: var(--surface); transition: border-color .12s;
    }
    .param-input:focus { outline: none; border-color: var(--accent); }
    .param-input[type=number] { max-width: 90px; }
    .param-id {
      flex: 1; font-size: 11px; font-family: var(--mono); color: var(--text-3);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 6px 10px; word-break: break-all;
    }
    .param-api-key { border-color: rgba(0,255,136,.25) !important; }
    .param-api-key:focus { border-color: var(--accent) !important; }
    .param-jwt-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 5px;
      border: 1px solid; font-size: 12px; flex: 1;
    }
    .param-jwt-ok  { border-color: rgba(0,255,136,.25); color: var(--accent); background: rgba(0,255,136,.05); }
    .param-jwt-bad { border-color: rgba(255,85,85,.25);  color: var(--red);    background: rgba(255,85,85,.05); }

    /* Buttons */
    .run-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #0c0c0c;
      border: none; border-radius: 6px; padding: 9px 22px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: all .12s; margin-bottom: 22px;
    }
    .run-btn:hover { opacity: .88; transform: translateY(-1px); }
    .run-btn:active { transform: none; }
    .run-btn:disabled { background: var(--text-3); color: var(--surface); cursor: not-allowed; transform: none; }
    .spinner {
      width: 13px; height: 13px; border: 2px solid #0c0c0c;
      border-top-color: transparent; border-radius: 50%;
      animation: spin .65s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Output */
    .output-wrap { border: 1px solid var(--border); border-radius: 8px; }
    .output-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .output-tab {
      padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--text-3);
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: all .1s; user-select: none;
    }
    .output-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .output-panel {
      background: var(--surface); padding: 13px 16px; font-family: var(--mono);
      font-size: 12.5px; line-height: 1.6; color: var(--text);
      max-height: 360px; overflow-y: auto; border-radius: 0 0 8px 8px;
      white-space: pre-wrap; word-break: break-word;
    }
    .output-panel.idle { color: var(--text-3); font-style: italic; white-space: normal; }
    .output-panel.err  { color: var(--red); }
    .msg-cards { padding: 10px; }
    .msg-card { border: 1px solid var(--border); border-radius: 7px; margin-bottom: 8px; overflow: hidden; }
    .msg-card:last-child { margin-bottom: 0; }
    .msg-card-hdr {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 11px; background: var(--surface-2); border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
    }
    .msg-card-hdr .turn { color: var(--blue); }
    .msg-card-hdr .score { color: var(--text-3); font-weight: 400; font-family: var(--mono); }
    .msg-prompt  { padding: 8px 11px; font-size: 13px; color: var(--text); line-height: 1.5; font-family: var(--font); }
    .msg-divider { height: 1px; background: var(--border); }
    .msg-resp    { padding: 8px 11px; font-size: 13px; color: var(--text-2); line-height: 1.5; font-family: var(--font); }
    .token-savings {
      margin-top: 14px; padding: 14px 16px;
      background: rgba(0,255,136,.04); border: 1px solid rgba(0,255,136,.12); border-radius: 8px;
    }
    .ts-title { font-size: 12px; font-weight: 700; color: var(--accent); margin: 0 0 12px; }
    .ts-row { margin-bottom: 8px; }
    .ts-lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-bottom: 3px; }
    .ts-track { height: 18px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
    .ts-fill {
      height: 100%; background: var(--accent); border-radius: 4px;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 6px; font-size: 10px; font-weight: 700; color: #0c0c0c;
      transition: width .6s ease;
    }
    .ts-savings { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 8px; }

    /* Recall stats panel */
    .cold-banner {
      display: flex; align-items: flex-start; gap: 9px; margin-bottom: 12px;
      background: rgba(255,204,68,.08); border: 1px solid rgba(255,204,68,.25);
      border-left: 3px solid var(--yellow); border-radius: 7px; padding: 10px 13px;
      font-size: 12.5px; color: rgba(255,204,68,.85); line-height: 1.5;
    }
    .cold-banner .cold-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }
    .recall-stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px;
    }
    .rs-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 10px 12px; text-align: center;
    }
    .rs-val {
      font-size: 22px; font-weight: 800; color: var(--text); font-family: var(--mono);
      line-height: 1.2; margin-bottom: 3px;
    }
    .rs-strategy { font-size: 13px !important; text-transform: uppercase; letter-spacing: .04em; }
    .rs-key { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .7px; }
    .msg-resp-pending { font-style: italic; color: var(--text-3) !important; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="logo-icon">⬡</span>GraphMem</a>
    <a href="/reference" class="nav-link">Docs</a>
    <a href="/reference" class="nav-link">Reference</a>
    <a href="/playground" class="nav-link active">Playground</a>
    <a href="https://github.com/avik22835/graphmem" class="nav-link" target="_blank" rel="noopener">GitHub ↗</a>
    <div class="nav-right">
      <div class="nav-divider"></div>
      <span id="navUser" style="font-size:13px;color:var(--text-2)"></span>
      <a href="/login" id="navLogin" class="nav-link">Log in</a>
      <a href="/signup" class="btn btn-ghost btn-sm">Get API Key</a>
    </div>
  </div>
</nav>

<div class="pg-wrap">
  <aside class="pg-sidebar">
    <div class="pg-sidebar-top">
      <div class="pg-field-label">Demo Conversation</div>
      <select class="pg-conv-select" id="convSelect" onchange="switchConv(this.value)">
        <option value="conv2">SaaS App Build (auth → payments → backend)</option>
        <option value="conv1">Multi-topic Chat (cooking → travel → coding)</option>
        <option value="custom">Custom ID…</option>
      </select>
      <input id="customConvInput" class="pg-conv-select" type="text" placeholder="Paste conv ID here"
        style="display:none;margin-top:6px" oninput="refreshCode()"/>
    </div>
    <div class="pg-method-list" id="methodList"></div>
  </aside>

  <main class="pg-main" id="methodPanel">
    <div style="color:var(--text-3);padding-top:40px;font-size:14px">Select a method from the sidebar →</div>
  </main>
</div>

<script src="/static/js/auth.js"></script>
<script>
const CONF = {
  conv1: { id: '0eaf5486-63c6-4f5c-a4d8-5c761f1fa91d' },
  conv2: { id: '0fd00ae3-5ffe-48f9-a3dc-6ac2e6badb16' },
};
const state = {
  conv: 'conv2', method: 'memory.recall', outputTab: 'cards',
  cache: {
    conv1:   { nodes:[], topics:[], nodeId:null, topicId:null },
    conv2:   { nodes:[], topics:[], nodeId:null, topicId:null },
    custom:  { nodes:[], topics:[], nodeId:null, topicId:null }
  }
};

const convId = () => state.conv === 'custom'
  ? (document.getElementById('customConvInput')?.value?.trim() || '')
  : CONF[state.conv].id;
const cache  = () => state.cache[state.conv];

function getApiKey() {
  return document.getElementById('p_api_key')?.value?.trim()
      || localStorage.getItem('gm_api_key') || '';
}
function saveApiKey(v) { if (v) localStorage.setItem('gm_api_key', v); }

async function apiFetch(path, opts={}) {
  const key = getApiKey();
  if (!key) throw new Error('Paste your API key in the field above');
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-API-Key': key, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  if (!r.ok) { const t = await r.text(); throw new Error(`${r.status} — ${t}`); }
  return r;
}

async function jwtFetch(path, opts={}) {
  const jwt = localStorage.getItem('gm_id_token');
  if (!jwt) throw new Error('Not logged in — log in at /login first, then come back here');
  const r = await fetch(path, {
    ...opts,
    headers: { 'Authorization': `Bearer ${jwt}`, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  if (!r.ok) { const t = await r.text(); throw new Error(`${r.status} — ${t}`); }
  return r;
}

function hl(code) {
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/"([^"\n]*)"/g, '<span class="cs">"$1"</span>');
  s = s.replace(/'([^'\n]*)'/g, "<span class=\"cs\">'$1'</span>");
  s = s.replace(/(#[^\n]*)/g,   '<span class="cc">$1</span>');
  s = s.replace(/\b(import|from|await|async|def|return|for|in|if|else|True|False|None|print|len|not)\b/g, '<span class="ck">$1</span>');
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="cn">$1</span>');
  return s;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Methods ─────────────────────────────────────────────────────── */
const METHODS = [
  // ── MEMORY ────────────────────────────────────────────────────────
  {
    id:'memory.recall', ns:'memory', label:'recall', badge:'POST', http:'POST /memory/recall',
    desc:'Retrieves the k most semantically relevant memory nodes for a query. Two-layer retrieval: pgvector HNSW cosine search (Layer 1) re-ranked by Neptune graph neighbourhood edges (Layer 2).',
    usecase:'Message 51 arrives in your chatbot. Instead of sending all 50 prior exchanges to the LLM, call recall() to fetch only the most relevant nodes. Focused context, fraction of the cost.',
    params:[
      {id:'query',label:'Query',type:'text',
       defConv1:'What cooking techniques did we discuss?',
       defConv2:'How should I handle JWT token expiry?'},
      {id:'k',label:'k',type:'number',def:5}
    ],
    code:(cid,p)=>
`import graphmem

gm = graphmem.GraphMemClient(api_key="gm_sk_...")

result = gm.memory.recall(
    conv_id="${cid}",
    query="${p.query}",
    k=${p.k},
    strategy="semantic",
)
print(f"GraphMem: {result.token_count} tokens")`,
    execute: async (cid,p) => {
      const sR = await apiFetch(`/conversations/${cid}/stats`);
      const stats = await sR.json();
      const r = await apiFetch('/memory/recall',{method:'POST',
        body:JSON.stringify({conversation_id:cid,query:p.query,k:parseInt(p.k),strategy:'semantic'})});
      const d = await r.json(); d._nodeCount=stats.node_count||0; d._fullEst=(stats.node_count||50)*150; return d;
    }, extra:'recall_view'
  },
  {
    id:'memory.add_prompt', ns:'memory', label:'add_prompt', badge:'POST', http:'POST /memory/prompt',
    desc:'Logs a user prompt as a new pending memory node. Returns a memory_id — pass it to add_response() after your LLM replies.',
    usecase:'Your agent receives a user message. Log it with add_prompt() before forwarding to the LLM so every turn is captured. Nothing is ever lost.',
    params:[{id:'content',label:'Content',type:'text',
      defConv1:'How do I make crème brûlée at home?',
      defConv2:'How do I rotate refresh tokens safely?'}],
    code:(cid,p)=>
`memory_id = gm.memory.add_prompt(
    conv_id="${cid}",
    content="${p.content}",
)
print(f"Node created: {memory_id}")`,
    execute: async (cid,p) => {
      const r = await apiFetch('/memory/prompt',{method:'POST',
        body:JSON.stringify({conversation_id:cid,content:p.content})});
      return r.json();
    }
  },
  {
    id:'memory.add_response', ns:'memory', label:'add_response', badge:'POST', http:'POST /memory/{memory_id}/response',
    desc:"Attaches the LLM's response to a pending node, marking it complete. Triggers the async pipeline: embedding → Neptune edges → topic recompute.",
    usecase:'Your LLM has replied. Call add_response() to seal the node — it becomes searchable via recall() within seconds.',
    params:[{id:'content',label:'Response',type:'text',
      defConv1:'Crème brûlée requires a kitchen torch for the caramelized sugar top.',
      defConv2:'On each refresh token use, issue a brand new one and invalidate the old (rotation pattern).'}],
    code:(cid,p)=>
`gm.memory.add_response(
    memory_id=memory_id,
    conv_id="${cid}",
    content=llm_response,
)`,
    execute: async (cid,p) => {
      const pR = await apiFetch('/memory/prompt',{method:'POST',
        body:JSON.stringify({conversation_id:cid,content:'Demo prompt for add_response'})});
      const {memory_id} = await pR.json();
      const r = await apiFetch(`/memory/${memory_id}/response`,{method:'POST',
        body:JSON.stringify({conversation_id:cid,content:p.content})});
      return {memory_id,...(await r.json())};
    }
  },
  {
    id:'memory.get', ns:'memory', label:'get', badge:'GET', http:'GET /memory/{memory_id}',
    desc:'Fetches a single memory node by ID — prompt, response, status, timestamps, metadata.',
    usecase:"Retrieve a stored memory_id to inspect what was logged, verify embedding status (status: complete = in graph), or display the original exchange.",
    params:[{id:'memory_id',label:'memory_id',type:'cache_node'}],
    code:(cid,p,c)=>
`node = gm.memory.get(memory_id="${c.nodeId||'<memory_id>'}")
print(node["prompt"])
print(node["status"])   # "complete" once embedded`,
    execute: async (cid,p,c) => {
      if (!c.nodeId) throw new Error('No nodes cached — paste an API key and run recall() first.');
      return (await apiFetch(`/memory/${c.nodeId}`)).json();
    }
  },
  {
    id:'memory.get_neighbours', ns:'memory', label:'get_neighbours', badge:'GET', http:'GET /memory/{memory_id}/neighbours',
    desc:'Returns memory nodes semantically adjacent in the Neptune similarity graph, ranked by edge weight.',
    usecase:'"Show me more context around this message." Follows Neptune graph edges — surfaces related exchanges regardless of when they occurred.',
    params:[
      {id:'memory_id',label:'memory_id',type:'cache_node'},
      {id:'threshold',label:'Threshold',type:'number',def:0.7}
    ],
    code:(cid,p,c)=>
`neighbours = gm.memory.get_neighbours(
    memory_id="${c.nodeId||'<memory_id>'}",
    threshold=${p.threshold},
)
for n in neighbours:
    print(f"[{n['edge_weight']:.2f}] {n['prompt'][:80]}")`,
    execute: async (cid,p,c) => {
      if (!c.nodeId) throw new Error('No nodes cached — paste an API key and run recall() first.');
      return (await apiFetch(`/memory/${c.nodeId}/neighbours?threshold=${p.threshold}&limit=10&order=relevance`)).json();
    }
  },
  {
    id:'memory.add_batch', ns:'memory', label:'add_batch', badge:'POST', http:'POST /memory/batch',
    desc:'Bulk-inserts up to 100 complete prompt+response pairs in one request. All items queued for embedding immediately.',
    usecase:"Onboarding a user with existing chat history. Batch-import their full history in one call instead of 200 individual requests.",
    params:[],
    code:(cid)=>
`memory_ids = gm.memory.add_batch(items=[
    {"conversation_id":"${cid}","prompt":"What is stateless auth?","response":"JWT — no server-side session."},
    {"conversation_id":"${cid}","prompt":"Better for microservices?","response":"Yes, scales horizontally."},
])
print(f"Imported {len(memory_ids)} nodes")`,
    execute: async (cid) => {
      const r = await apiFetch('/memory/batch',{method:'POST',body:JSON.stringify({items:[
        {conversation_id:cid,prompt:"What's the difference between stateless and stateful auth?",response:"Stateless auth (JWT) stores session in the token — no server-side state needed."},
        {conversation_id:cid,prompt:"Which is better for microservices?",response:"Stateless JWT scales horizontally without a shared session store."},
      ]})});
      return r.json();
    }
  },
  // ── CONVERSATIONS ──────────────────────────────────────────────────
  {
    id:'conversations.create', ns:'conversations', label:'create', badge:'POST', http:'POST /conversations',
    desc:'Creates a new empty conversation context and returns a conversation_id.',
    usecase:'A new user signs up or starts a fresh chat. Call create() to provision an isolated memory context tied to their session.',
    params:[],
    code:()=>
`conv_id = gm.conversations.create()
db.save(user_id=current_user.id, conv_id=conv_id)`,
    execute: async () => (await apiFetch('/conversations',{method:'POST',body:JSON.stringify({})})).json()
  },
  {
    id:'conversations.list', ns:'conversations', label:'list', badge:'GET', http:'GET /conversations',
    desc:'Lists all conversations for your API key, ordered newest first.',
    usecase:'Admin dashboard — see all active agent sessions, node counts, and topic timestamps.',
    params:[],
    code:()=>
`convs = gm.conversations.list()
for c in convs:
    print(f"{c['conversation_id'][:8]}…  nodes={c['node_count']}")`,
    execute: async () => (await apiFetch('/conversations')).json()
  },
  {
    id:'conversations.get_stats', ns:'conversations', label:'get_stats', badge:'GET', http:'GET /conversations/{conv_id}/stats',
    desc:'Returns node count, topic count, dirty topics, first/last activity, and embedding coverage.',
    usecase:'Check conversation size before choosing retrieval strategy — use recall() if node_count > 20, else send full history.',
    params:[],
    code:(cid)=>
`stats = gm.conversations.get_stats(conv_id="${cid}")
if stats["node_count"] > 20:
    context = gm.memory.recall(conv_id, query=query, k=5)
else:
    context = gm.conversations.export(conv_id)`,
    execute: async (cid) => (await apiFetch(`/conversations/${cid}/stats`)).json()
  },
  {

/* ── Sidebar ──────────────────────────────────────────────────────── */
function renderSidebar() {
  const order  = ['memory','conversations','topics','auth','utils'];
  const labels = {memory:'Memory',conversations:'Conversations',topics:'Topics',auth:'Auth',utils:'Utils'};
  let html = '';
  for (const ns of order) {
    html += `<div class="pg-ns-head">${labels[ns]}</div>`;
    METHODS.filter(m=>m.ns===ns).forEach(m=>{
      const jt = m.jwt ? ' <span class="jwt-tag">session</span>' : '';
      html += `<div class="pg-item${m.id===state.method?' active':''}" onclick="selectMethod('${m.id}')">${m.label}${jt}</div>`;
    });
  }
  document.getElementById('methodList').innerHTML = html;
}

/* ── Panel rendering ──────────────────────────────────────────────── */
function renderApiKeyParam() {
  const v = esc(localStorage.getItem('gm_api_key')||'');
  return `<div class="param-row">
    <span class="param-label">API Key</span>
    <input class="param-input param-api-key" id="p_api_key" type="password"
           value="${v}" placeholder="gm_sk_… paste your key"
           oninput="saveApiKey(this.value); refreshCode()"/>
  </div>`;
}

function renderJwtParam() {
  const jwt   = localStorage.getItem('gm_id_token');
  const email = localStorage.getItem('gm_email') || '';
  if (jwt) {
    return `<div class="param-row">
      <span class="param-label">Auth</span>
      <div class="param-jwt-row param-jwt-ok">✓ Logged in${email?' as '+esc(email):''} — session JWT will be used</div>
    </div>`;
  }
  return `<div class="param-row">
    <span class="param-label">Auth</span>
    <div class="param-jwt-row param-jwt-bad">Not logged in — <a href="/login" style="color:var(--accent)">log in at /login</a> first, then come back</div>
  </div>`;
}

function renderParam(pr) {
  const c = cache();
  if (pr.type === 'cache_node') {
    return `<div class="param-row"><span class="param-label">${pr.label}</span><span class="param-id">${esc(c.nodeId||'(no nodes yet)')}</span></div>`;
  }
  if (pr.type === 'cache_topic') {
    return `<div class="param-row"><span class="param-label">${pr.label}</span><span class="param-id">${esc(c.topicId||'(no topics yet — wait ~30s)')}</span></div>`;
  }
  if (pr.type === 'select') {
    const opts = pr.options.map(o=>`<option${o===(pr.def||pr.options[0])?' selected':''}>${o}</option>`).join('');
    return `<div class="param-row"><span class="param-label">${pr.label}</span><select class="param-input" id="p_${pr.id}" onchange="refreshCode()">${opts}</select></div>`;
  }
  if (pr.type === 'textarea') {
    const v = esc(state.conv==='conv1'?(pr.defConv1||''):(pr.defConv2||''));
    return `<div class="param-row" style="align-items:flex-start"><span class="param-label" style="padding-top:8px">${pr.label}</span><textarea class="param-input" id="p_${pr.id}" rows="3" style="resize:vertical" oninput="refreshCode()">${v}</textarea></div>`;
  }
  const v = state.conv==='conv1'
    ? (pr.defConv1!==undefined?pr.defConv1:(pr.def!==undefined?pr.def:''))
    : (pr.defConv2!==undefined?pr.defConv2:(pr.def!==undefined?pr.def:''));
  return `<div class="param-row"><span class="param-label">${pr.label}</span><input class="param-input" id="p_${pr.id}" type="${pr.type||'text'}" value="${esc(String(v))}" oninput="refreshCode()"/></div>`;
}

function collectParams(m) {
  const p={}, c=cache();
  (m.params||[]).forEach(pr=>{
    if (pr.type==='cache_node')  { p[pr.id]=c.nodeId;  return; }
    if (pr.type==='cache_topic') { p[pr.id]=c.topicId; return; }
    const el=document.getElementById(`p_${pr.id}`); p[pr.id]=el?el.value:'';
  });
  return p;
}

function refreshCode() {
  const m=METHODS.find(x=>x.id===state.method); if (!m) return;
  const el=document.getElementById('codeDisplay');
  if (el) el.innerHTML=hl(m.code(convId(),collectParams(m),cache()));
}

function renderPanel(m) {
  const needsKey = !m.noKey && !m.jwt;
  const keyField = needsKey ? renderApiKeyParam() : '';
  const jwtField = m.jwt ? renderJwtParam() : '';
  const paramsHtml = (m.params||[]).map(renderParam).join('');
  const runDisabled = (m.jwt && !localStorage.getItem('gm_id_token')) ? ' disabled' : '';
  const tabsHtml = m.extra==='recall_view'
    ? `<div id="statsPanel"></div>
       <div class="output-wrap"><div class="output-tabs">
         <div class="output-tab active" id="tabCards" onclick="switchTab('cards')">Nodes</div>
         <div class="output-tab" id="tabJson" onclick="switchTab('json')">JSON</div>
       </div><div class="output-panel idle" id="outputPanel">Click ▶ Run to execute</div></div>`
    : `<div class="output-wrap"><div class="output-tabs"><div class="output-tab active">Output</div></div>
       <div class="output-panel idle" id="outputPanel">Click ▶ Run to execute</div></div>`;

  document.getElementById('methodPanel').innerHTML = `
    <h1 class="method-title">gm.${m.ns}.<span style="color:var(--accent)">${m.label}</span><span class="badge b-${m.badge}">${m.badge}</span></h1>
    <p class="method-http">${m.http}</p>
    <p class="method-desc">${m.desc}</p>
    <div class="usecase-box"><div class="uc-label">💡 Use Case</div><p class="uc-text">${m.usecase}</p></div>
    <div class="sec-label">Code Example</div>
    <pre class="code-block" id="codeDisplay">${hl(m.code(convId(),collectParams(m),cache()))}</pre>
    <div class="params-wrap">${jwtField}${keyField}${paramsHtml}</div>
    <button class="run-btn" id="runBtn" onclick="runMethod()"${m.execute?runDisabled:' disabled'}><span>▶ Run</span></button>
    <div class="sec-label">Output</div>
    ${tabsHtml}`;
}

function selectMethod(id) {
  state.method=id; state.outputTab='cards';
  renderSidebar();
  const m=METHODS.find(x=>x.id===id); if (m) renderPanel(m);
}
function switchConv(k) {
  state.conv = k;
  const inp = document.getElementById('customConvInput');
  if (inp) inp.style.display = k === 'custom' ? 'block' : 'none';
  selectMethod(state.method);
}

function switchTab(t) {
  state.outputTab=t;
  document.getElementById('tabCards')?.classList.toggle('active',t==='cards');
  document.getElementById('tabJson')?.classList.toggle('active',t==='json');
  const o=document.getElementById('outputPanel');
  if (o?._data) renderOutput(o._data,o);
}

/* ── Output ──────────────────────────────────────────────────────── */
function renderOutput(data,panel) {
  const m=METHODS.find(x=>x.id===state.method);
  panel._data=data;
  if (m?.extra==='recall_view' && state.outputTab==='cards') {
    const nodes=data.messages||data.nodes||data.items||[];
    if (!nodes.length) { panel.className='output-panel idle'; panel.innerHTML='No nodes returned.'; return; }
    panel.className='output-panel'; panel.style.whiteSpace='normal';
    panel.innerHTML='<div class="msg-cards">'+nodes.map((n,i)=>{
      const score = n.relevance_score !== undefined
        ? `<span class="score">score: ${Number(n.relevance_score).toFixed(3)}</span>` : '';
      const resp = n.response
        ? `<div class="msg-resp">${esc(n.response)}</div>`
        : `<div class="msg-resp msg-resp-pending">(response pending)</div>`;
      return `<div class="msg-card">
        <div class="msg-card-hdr"><span class="turn">Node ${n.index ?? i+1}</span>${score}</div>
        <div class="msg-prompt">${esc(n.prompt||'')}</div>
        <div class="msg-divider"></div>
        ${resp}
      </div>`;
    }).join('')+'</div>';
  } else {
    panel.className='output-panel'; panel.style.whiteSpace='pre-wrap';
    panel.textContent=JSON.stringify(data,null,2);
  }
}

async function runMethod() {
  const m=METHODS.find(x=>x.id===state.method); if (!m||!m.execute) return;
  const btn=document.getElementById('runBtn'), out=document.getElementById('outputPanel');
  const statsEl=document.getElementById('statsPanel');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Running…';
  out.className='output-panel idle'; out.textContent='Running…'; out.style.whiteSpace='normal';
  if (statsEl) statsEl.innerHTML='';
  try {
    const data=await m.execute(convId(),collectParams(m),cache());
    if (m.extra==='recall_view' && statsEl) renderStats(data, statsEl, cache());
    renderOutput(data,out);
  } catch(e) {
    out.className='output-panel err'; out.style.whiteSpace='pre-wrap'; out.textContent=e.message;
  } finally { btn.disabled=false; btn.innerHTML='<span>▶ Run</span>'; }
}

function renderStats(data, el, c) {
  const nodes      = data.messages || data.nodes || [];
  const retrieved  = nodes.length;
  const totalNodes = data._nodeCount || (c && c.nodes && c.nodes.length) || 0;
  const gmTokens   = data.total_tokens || 0;
  const strategy   = data.strategy_used || 'unknown';

  const fullEst = data._fullEst || (totalNodes > 0 && retrieved > 0
    ? Math.round(gmTokens * totalNodes / retrieved)
    : (gmTokens > 0 ? gmTokens * 10 : 7500));
  const pct  = gmTokens > 0 ? Math.max(0, Math.min(99, Math.round((1 - gmTokens/fullEst) * 100))) : 0;
  const gmW  = Math.max(1, Math.round(gmTokens / fullEst * 100));

  const stratColor = {'cold_start':'var(--yellow)','semantic':'var(--accent)','semantic_recency':'var(--blue)'}[strategy]||'var(--text-3)';

  const coldBanner = strategy === 'cold_start'
    ? `<div class="cold-banner"><span class="cold-icon">⚠</span><span>Embeddings still processing — showing full conversation history as fallback. Semantic retrieval activates once the node worker completes.</span></div>`
    : '';

  el.innerHTML = `
    ${coldBanner}
    <div class="recall-stats-grid">
      <div class="rs-card">
        <div class="rs-val">${totalNodes > 0 ? totalNodes : '—'}</div>
        <div class="rs-key">Graph Nodes</div>
      </div>
      <div class="rs-card">
        <div class="rs-val">${retrieved}</div>
        <div class="rs-key">Retrieved</div>
      </div>
      <div class="rs-card">
        <div class="rs-val" style="color:var(--accent)">${pct > 0 ? pct+'%' : '—'}</div>
        <div class="rs-key">Token Reduction</div>
      </div>
      <div class="rs-card">
        <div class="rs-val rs-strategy" style="color:${stratColor}">${strategy.replace(/_/g,' ')}</div>
        <div class="rs-key">Strategy</div>
      </div>
    </div>
    <div class="token-savings">
      <div class="ts-title">Token context comparison</div>
      <div class="ts-row">
        <div class="ts-lbl"><span>Full history (est.)</span><span>${fullEst.toLocaleString()} tokens</span></div>
        <div class="ts-track"><div style="height:100%;background:var(--border-2);border-radius:4px;width:100%"></div></div>
      </div>
      <div class="ts-row">
        <div class="ts-lbl"><span>GraphMem recall</span><span>${gmTokens.toLocaleString()} tokens</span></div>
        <div class="ts-track"><div class="ts-fill" style="width:${gmW}%">${gmW>12?gmW+'%':''}</div></div>
      </div>
      ${pct > 0 ? `<div class="ts-savings">↓ ${pct}% token reduction — ${(fullEst-gmTokens).toLocaleString()} tokens saved</div>` : ''}
    </div>`;
}

/* ── Init ─────────────────────────────────────────────────────────── */
async function init() {
  // Nav: show logged-in email
  if (typeof gmIsAuthenticated==='function' && gmIsAuthenticated()) {
    const email=localStorage.getItem('gm_email')||'';
    const nu=document.getElementById('navUser');
    const nl=document.getElementById('navLogin');
    if (nu) nu.textContent=email;
    if (nl) nl.style.display='none';
  }

  // Prefetch demo data if API key available
  const key=localStorage.getItem('gm_api_key')||'';
  if (key) {
    for (const [k,c] of [['conv1',CONF.conv1],['conv2',CONF.conv2]]) {
      try {
        const [nR,tR]=await Promise.all([
          fetch(`/conversations/${c.id}/export`,{headers:{'X-API-Key':key}}),
          fetch(`/topics?conversation_id=${c.id}`,{headers:{'X-API-Key':key}})
        ]);
        const nodes=nR.ok?await nR.json():[], topics=tR.ok?await tR.json():[];
        const nA=Array.isArray(nodes)?nodes:[], tA=Array.isArray(topics)?topics:[];
        state.cache[k]={nodes:nA,topics:tA,
          nodeId:nA.find(n=>n.status==='complete')?.memory_id||nA[0]?.memory_id||null,
          topicId:tA[0]?.topic_id||null};
      } catch(e){ console.warn(e); }
    }
  }
  renderSidebar();
  selectMethod('memory.recall');
}
init();
</script>
</body>
</html>
