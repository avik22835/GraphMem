name: Build, Push and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          docker build -t 748439418518.dkr.ecr.us-east-1.amazonaws.com/avik22835/graphmem:latest .
          docker push 748439418518.dkr.ecr.us-east-1.amazonaws.com/avik22835/graphmem:latest

      - name: Build and push node-worker image
        run: |
          docker build -t 748439418518.dkr.ecr.us-east-1.amazonaws.com/avik22835/graphmem:node-worker \
            -f workers/node_worker/Dockerfile workers/node_worker/
          docker push 748439418518.dkr.ecr.us-east-1.amazonaws.com/avik22835/graphmem:node-worker

      - name: Build and push topic-worker image
        run: |
          docker build -t 748439418518.dkr.ecr.us-east-1.amazonaws.com/avik22835/graphmem:topic-worker \
            -f workers/topic_worker/Dockerfile workers/topic_worker/
          docker push 748439418518.dkr.ecr.us-east-1.amazonaws.com/avik22835/graphmem:topic-worker

      - name: Register new task definition revision
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition graphmem-task --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          for c in td['containerDefinitions']:
              if c['name'] == 'graphmem-api':
                  c['image'] = '748439418518.dkr.ecr.us-east-1.amazonaws.com/avik22835/graphmem:latest'
          keys = ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy','deregisteredAt']
          [td.pop(k, None) for k in keys]
          print(json.dumps(td))
          ")
          aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF"

      - name: Deploy new revision to ECS
        run: |
          LATEST=$(aws ecs describe-task-definition --task-definition graphmem-task --query 'taskDefinition.revision' --output text)
          aws ecs update-service \
            --cluster graphmem-cluster \
            --service graphmem-service \
            --task-definition graphmem-task:$LATEST \
            --region us-east-1
