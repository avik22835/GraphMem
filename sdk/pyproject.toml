[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphmem-sdk"
version = "0.1.0"
description = "Python SDK for the GraphMem semantic memory API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/avik22835/graphmem"

[tool.hatch.build.targets.wheel]
packages = ["graphmem"]
